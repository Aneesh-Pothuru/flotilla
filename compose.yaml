services:
  flotilla:
    build: .
    restart: unless-stopped
    environment:
      FLOTILLA_API_TOKEN: "${FLOTILLA_API_TOKEN:?set a 16+ character token}"
      FLOTILLA_ALLOWED_ORIGIN: "${FLOTILLA_ALLOWED_ORIGIN:-}"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - flotilla-data:/var/lib/flotilla
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  flotilla-data:
