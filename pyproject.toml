[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flotilla"
version = "0.1.0"
description = "A deterministic thesis-portfolio manager for research teams"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aneesh Pothuru"}]
dependencies = []

[project.scripts]
flotilla = "flotilla.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

